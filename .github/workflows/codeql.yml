# CodeQL static analysis (Go), results to the Security tab.
name: codeql

on:
  push:
    branches: [main, 'ci/**'] # ci/** proves a workflow change green before it lands on main
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1' # Mondays 03:27 UTC
  workflow_dispatch: # so a run can be kicked off without inventing a commit

permissions: {}

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload CodeQL results
      contents: read
      actions: read
    steps:
      # Deny egress by default; see ci.yml. uploads.github.com is where the SARIF result goes,
      # storage.googleapis.com is where setup-go falls back for a toolchain the runner has
      # not cached.
      - name: Harden the runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            uploads.github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, never a literal: a literal here drifted to 1.27 while go.mod and the GitLab gate stayed on 1.26.
          go-version-file: go.mod
          check-latest: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: autobuild
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:go"
