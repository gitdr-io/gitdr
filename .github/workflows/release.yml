# Release, triggered by a v*.*.* tag. GoReleaser builds the static linux binaries +
# multi-arch GHCR image, cosign keyless-signs the checksums and the image (GitHub OIDC, no
# key material), publishes a GitHub Release, and attaches build provenance to the binaries.
# Uses the built-in GITHUB_TOKEN for GHCR and Releases, no personal access token.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release
      packages: write      # push the image to GHCR
      id-token: write      # cosign keyless signing (Sigstore OIDC)
      attestations: write  # store the build provenance
    steps:
      # Audit, not block, and deliberately: a release reaches Sigstore, GHCR, the Go proxy,
      # the Docker and Chainguard registries, and three tool downloads. One endpoint missing
      # from an allowlist here means a failed release, not a caught intrusion. The read-only
      # workflows are blocked; this one is watched, and its egress is reviewed per release.
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          check-latest: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin: cosign >= 2.6 defaults to the new Sigstore bundle format, which breaks
          # GoReleaser's --output-signature/--output-certificate sign-blob config. v2.5.3
          # keeps the classic .sig/.pem outputs that any cosign version can verify.
          cosign-release: 'v2.5.3'
      - name: Install syft (SBOMs)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every artifact in checksums.txt: what built it, from which
      # commit, in which workflow. Signed through Sigstore and written to the public
      # transparency log. Verify with:
      #   gh attestation verify gitdr_0.1.0_linux_amd64.tar.gz --repo gitdr-io/gitdr
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The image needs its own subject. checksums.txt covers the tarballs only, so until
      # now someone pulling the container could verify who signed it but not where it was
      # built — a signature says "we made this", provenance says "here is the commit and
      # the workflow run that made it". Both, or the claim is half a claim.
      - name: Read the published image digest
        id: image
        run: |
          digest=$(jq -r '[.[] | select(.type == "Docker Manifest")][0].extra.Digest' dist/artifacts.json)
          case "$digest" in
            sha256:*) ;;
            *) echo "no image digest in dist/artifacts.json, refusing to attest nothing" >&2; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gitdr-io/gitdr
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  # Package the Helm chart and push it to GHCR as an OCI artifact, then cosign-sign it by
  # digest (keyless, GitHub OIDC). Install: helm install oci://ghcr.io/gitdr-io/charts/gitdr
  chart:
    name: helm chart
    needs: [goreleaser]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # push the chart to GHCR
      id-token: write # cosign keyless
      attestations: write # store the chart's build provenance
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin: cosign >= 2.6 defaults to the new Sigstore bundle format, which breaks
          # GoReleaser's --output-signature/--output-certificate sign-blob config. v2.5.3
          # keeps the classic .sig/.pem outputs that any cosign version can verify.
          cosign-release: 'v2.5.3'
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Helm registry login
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Package and push chart
        id: push
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="${REF_NAME#v}"
          helm package charts/gitdr --version "$v" --app-version "$v"
          out=$(helm push "gitdr-${v}.tgz" oci://ghcr.io/gitdr-io/charts 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "digest=$(printf '%s' "$out" | awk '/[Dd]igest:/{print $NF}')" >> "$GITHUB_OUTPUT"
      - name: Sign chart
        env:
          CHART_REF: ghcr.io/gitdr-io/charts/gitdr@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$CHART_REF"
      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gitdr-io/charts/gitdr
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Read the release back.
  #
  # Everything above signs and attests; nothing above checks that it worked. That gap is how
  # v0.1.5 shipped with a signed image carrying no provenance and nobody noticing until
  # someone went looking by hand. It is the same failure this product exists to prevent, one
  # layer up: a process that reports success is not evidence, the artifact is.
  #
  # This job fails the release if any published artifact is unsigned or unattested.
  verify:
    name: verify the release
    needs: [goreleaser, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read # download the release assets
      packages: read # read the image and chart from GHCR
      attestations: read # read the provenance store
    env:
      # The identity that is allowed to have signed any of this. A signature from anything
      # else is not a pass.
      IDENTITY: https://github.com/gitdr-io/gitdr/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}
      ISSUER: https://token.actions.githubusercontent.com
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Binaries — signature, checksums, provenance
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl
          cd dl

          cosign verify-blob checksums.txt \
            --certificate checksums.txt.pem \
            --signature checksums.txt.sig \
            --certificate-identity "$IDENTITY" \
            --certificate-oidc-issuer "$ISSUER"

          # Every line of the signed list, against the bytes actually published.
          sha256sum -c checksums.txt

          for f in *.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow gitdr-io/gitdr/.github/workflows/release.yml
          done

      - name: Image — signature and provenance
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="ghcr.io/gitdr-io/gitdr:${VERSION#v}"
          cosign verify "$ref" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          cosign verify-attestation "$ref" --type slsaprovenance \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null

      - name: Chart — signature and provenance
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="ghcr.io/gitdr-io/charts/gitdr:${VERSION#v}"
          cosign verify "$ref" \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
          cosign verify-attestation "$ref" --type slsaprovenance \
            --certificate-identity "$IDENTITY" --certificate-oidc-issuer "$ISSUER" > /dev/null
