# Blocks pull requests that introduce dependencies with known vulns or bad licenses.
name: dependency-review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    name: dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Deny egress by default; see ci.yml. This one only reads the PR's dependency diff and
      # the advisory database, both through the API.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
